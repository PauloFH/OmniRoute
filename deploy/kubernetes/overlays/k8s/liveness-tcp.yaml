# OPTIONAL patch — not wired into kustomization.yaml by default.
#
# Apply this when HTTP /livez times out under catalog/compression load and the
# kubelet starts restarting a pod that is merely busy. TCP cannot be starved by
# the event loop the way an HTTP handler can. Add to the overlay's `patches:`
# list to enable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
spec:
  template:
    spec:
      containers:
        - name: omniroute
          livenessProbe:
            httpGet: null
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
